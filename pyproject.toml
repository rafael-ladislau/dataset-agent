[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "dataset-agent"
version = "0.1.0"
description = "Dataset metadata research agent (CLI + API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anthropic>=0.42",
    "ddgs>=9.0",
    "tavily-python>=0.5",
    "dimcli>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
spreadsheet = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.scripts]
dataset-research = "dataset_agent.interfaces.cli:main"
dataset-research-api = "dataset_agent.main_api:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
