Agent Playbook
Here’s what I changed after reading this paper.

Audit your current setup — Open your CLAUDE.md, cursor rules, or system prompts right now. Count how many lines are flat instructions vs reasoned principles. If it’s mostly “do this, don’t do that” — you have the 22% to 15% version.
Rewrite rules as reasoned principles — Every rule should have a “because” attached. Not “use TypeScript strict mode.” Use: “We use TypeScript strict mode because this is a financial system where type errors cause incorrect transactions.”
Write a codebase constitution — Five to ten statements about what this project values and why. This goes at the top of your CLAUDE.md before any specific rules. It sets the reasoning framework for everything that follows.
Expand your agent’s context — Add your README, ADRs, relevant test files, and incident history to what the agent sees. Not because it will reference them on every task, but because context shapes reasoning.
Stop patching individual failures with individual rules. When your agent makes a bad decision, don’t just add a rule against that specific action. Ask: What principle was the agent missing? Teach that principle.
Test on your worst code — Your agent’s real performance isn’t measured on a clean project. Point it at the legacy module with implicit conventions and see what happens. That’s your actual alignment evaluation.
Combine principles with examples — Anthropic found that doing both together was the most effective strategy. Show examples of good PRs and good decisions alongside the principles they embody.
